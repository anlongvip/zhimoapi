<template id="home"><section class="hero"><div class="eyebrow"><i></i> 智墨开发者文档</div><div class="herogrid"><div><h1>统一接入 AI 模型<br><em>从这里开始</em></h1><p>通过一个 API 入口连接平台当前提供的模型，在控制台管理密钥、查看计价与调用用量。跟随文档完成首次接入。</p><a class="button" href="#quickstart">快速开始　→</a><a class="button outline" href="https://api.zhimomedia.com/pricing">查看模型与价格</a><div class="tags">人民币计价展示　·　OpenAI 兼容接口　·　个人与企业服务</div></div><div class="art"><div class="ring"></div><img src="/logo.svg" alt="智墨标志"><span>ZHIMO · AI GATEWAY</span></div></div></section><section class="cards"><a href="#quickstart"><b>01　快速开始</b><p>创建密钥并发送第一次 API 请求。</p></a><a href="#api"><b>02　API 接入</b><p>查看接口地址、鉴权方式和请求示例。</p></a><a href="#faq"><b>03　问题排查</b><p>常见错误、模型选择和用量问题。</p></a></section><section class="section"><div class="kicker">DOCUMENTATION</div><h2>按你的使用场景开始</h2><div class="cards"><article><b>个人开发者</b><p>接入模型服务，查看 API 调用与计价方式。</p><a href="#quickstart">开始接入 →</a></article><article><b>团队与工作室</b><p>管理项目密钥，查看使用情况。</p><a href="#clients">配置客户端 →</a></article><article><b>企业客户</b><p>咨询 API 接入、发票与对公付款等安排。</p><a href="#enterprise">了解企业服务 →</a></article></div><div class="callout"><b>请先查看当前可用模型</b><p>模型的接口能力、价格和状态可能不同，请以模型广场及控制台显示为准。</p></div></section></template>
<template id="quickstart"><header class="pagehead"><div class="kicker">GETTING STARTED</div><h1>快速开始</h1><p>准备一个智墨 API 密钥，用几步完成首次调用。</p></header><div class="callout"><b>开始前</b><p>请登录智墨控制台，并确认账户状态、可用模型和余额满足调用要求。</p></div><ol class="steps"><li><b>查看模型与计价</b><p>打开<a href="https://api.zhimomedia.com/pricing">模型广场</a>，确认模型名称、计价和支持能力。模型名请使用页面实际展示的名称。</p></li><li><b>创建 API 密钥</b><p>进入控制台的密钥或令牌管理页面创建密钥并妥善保存。不要公开密钥。</p></li><li><b>设置接口地址</b><pre>https://api.zhimomedia.com/v1</pre></li><li><b>发起测试请求</b><pre>curl https://api.zhimomedia.com/v1/chat/completions \
  -H "Authorization: Bearer YOUR_API_KEY" \
  -H "Content-Type: application/json" \
  -d '{"model":"YOUR_MODEL_NAME","messages":[{"role":"user","content":"你好"}]}'</pre><p>将密钥和模型名称替换成自己的值。</p></li><li><b>查看调用结果</b><p>成功时会返回模型回复。调用记录和消耗情况可在控制台查看。</p></li></ol><a class="button" href="#api">继续阅读 API 接入 →</a></template>
<template id="api"><header class="pagehead"><div class="kicker">API REFERENCE</div><h1>API 接入</h1><p>使用 Bearer Token 鉴权。下面是 OpenAI 兼容的聊天补全调用。</p></header><h2>接口地址</h2><div class="endpoint"><b>POST</b><code>https://api.zhimomedia.com/v1/chat/completions</code></div><h2>鉴权方式</h2><pre>Authorization: Bearer YOUR_API_KEY</pre><h2>cURL 示例</h2><pre>curl https://api.zhimomedia.com/v1/chat/completions \
  -H "Authorization: Bearer YOUR_API_KEY" \
  -H "Content-Type: application/json" \
  -d '{"model":"YOUR_MODEL_NAME","messages":[{"role":"user","content":"你好"}]}'</pre><h2>查询可用模型</h2><pre>curl https://api.zhimomedia.com/v1/models \
  -H "Authorization: Bearer YOUR_API_KEY"</pre><div class="callout"><b>兼容性提示</b><p>具体参数和能力取决于模型及上游渠道，请以模型说明和实际结果为准。不要把 API 密钥放入公开网页或代码仓库。</p></div></template>
<template id="models"><header class="pagehead"><div class="kicker">MODELS &amp; PRICING</div><h1>模型与计价</h1><p>模型名称、价格和服务能力以控制台实时展示为准。</p></header><div class="callout"><b>调用前核对价格</b><p>模型供应和价格可能调整。请到模型广场核对计价单位、能力说明和可用状态，不要按过期文档估算费用。</p></div><h2>选择模型时请确认</h2><ol><li>模型名称与调用接口是否匹配。</li><li>输入、输出及其他计价规则。</li><li>账户和 API 密钥是否可以访问该模型。</li></ol><a class="button" href="https://api.zhimomedia.com/pricing" target="_blank" rel="noopener">前往模型广场 ↗</a></template>
<template id="clients"><header class="pagehead"><div class="kicker">CLIENT SETUP</div><h1>客户端配置</h1><p>支持 OpenAI 兼容接口的工具通常需要 API 密钥、Base URL 和模型名称。</p></header><div class="config"><p><b>API 密钥</b><code>填写控制台创建的 API 密钥</code></p><p><b>Base URL</b><code>https://api.zhimomedia.com/v1</code></p><p><b>模型名称</b><code>填写模型广场中显示的准确名称</code></p></div><h2>通用配置步骤</h2><ol><li>在客户端选择 OpenAI 兼容或自定义服务。</li><li>填写智墨 API 密钥和 Base URL。</li><li>选择模型广场中展示的模型名称。</li><li>保存后发送一条简单请求确认连接。</li></ol><div class="callout"><b>不同客户端字段名可能不同</b><p>若客户端要求填写完整请求路径，请按其提示填写；不要重复添加 /v1。</p></div></template>
<template id="faq"><header class="pagehead"><div class="kicker">HELP CENTER</div><h1>常见问题</h1><p>请先检查密钥、模型名称、账户状态和请求地址。</p></header><details open><summary>提示 401 或鉴权失败怎么办？</summary><p>确认使用智墨控制台创建的 API 密钥，请求头格式为 Bearer Token，密钥未撤销且输入正确。登录密码不是 API 密钥。</p></details><details><summary>提示模型不存在或不可用怎么办？</summary><p>核对模型名称与模型广场完全一致，并确认账户和密钥可以访问该模型。</p></details><details><summary>额度不足或请求被限流怎么办？</summary><p>查看账户余额、使用限制和调用记录；请求过于频繁时可降低频率后再试。</p></details><details><summary>请求一直失败怎么办？</summary><p>用简单文本请求检查 Base URL、路径、模型名和 JSON 格式。联系支持时请删除密钥及个人数据。</p></details><details><summary>价格是固定的吗？</summary><p>请以模型广场当前展示为准，文档示例不代表具体价格。</p></details><details><summary>API 密钥可以放在网页前端吗？</summary><p>不建议。浏览器代码可能被访问者查看，正式应用应由自己的服务端保存密钥并调用 API。</p></details></template>
<template id="enterprise"><header class="pagehead"><div class="kicker">BUSINESS SERVICES</div><h1>企业合作</h1><p>面向企业项目，沟通模型接入、使用管理与商务服务安排。</p></header><section class="enterprise"><div class="kicker">FOR YOUR TEAM</div><h2>让 AI 模型更顺畅地进入业务流程</h2><p>可围绕项目需求沟通 API 接入、模型使用和用量管理。企业客户如需发票或对公付款，请联系商务确认具体流程与支持范围。</p></section><div class="rows"><article><b>01　需求沟通</b><p>说明业务场景、预计规模和希望接入的模型类型。</p></article><article><b>02　接入评估</b><p>结合平台当前模型与能力，确认适用接口和实施方式。</p></article><article><b>03　商务确认</b><p>发票、对公付款及其他企业服务事项，以双方沟通确认为准。</p></article></div><div class="callout"><b>联系智墨</b><p>请通过智墨平台公布的联系方式联系商务。请勿在公开留言中发送 API 密钥。</p></div></template>
<script>
